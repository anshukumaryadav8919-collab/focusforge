name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Unzip and build
        run: |
          mkdir src_app
          unzip -q "$(ls *.zip | head -1)" -d src_app
          cd src_app
          if ! gradle --no-daemon --console=plain assembleDebug > ../build.log 2>&1; then
            MSG=$(grep -E "^e: |What went wrong|Execution failed|Could not|error:|Unresolved" -A3 ../build.log | head -25 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=GRADLE ERROR::$MSG"
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk ../FocusForge.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FocusForge (latest build)
          files: FocusForge.apk
